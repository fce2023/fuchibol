user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    
    client_max_body_size 50M;
    
    gzip on;
    gzip_types application/vnd.apple.mpegurl;

    server {
        listen 80;
        server_name localhost;

        resolver 127.0.0.11 valid=10s;

        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
        }

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        location /rtc/ {
            proxy_pass http://srs:1985/rtc/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
        }

        location /hls/ {
            alias /usr/share/nginx/html/hls/;
            add_header Access-Control-Allow-Origin * always;

            # Dedicated Master Link for OLT
            location = /hls/live/master.m3u8 {
                if ($request_method = 'OPTIONS') {
                    add_header 'Access-Control-Allow-Origin' '*';
                    add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
                    add_header 'Access-Control-Allow-Headers' 'Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type';
                    add_header 'Access-Control-Max-Age' 1728000;
                    add_header 'Content-Type' 'text/plain; charset=utf-8';
                    add_header 'Content-Length' 0;
                    return 204;
                }
                proxy_pass http://backend:8000/api/v1/streams/playback/1/manifest;
                proxy_set_header Host $http_host;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type' always;
                add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
            }

            # Compatibility link (the one user asked for)
            location = /hls/live/channel_1.m3u8 {
                if ($request_method = 'OPTIONS') {
                    add_header 'Access-Control-Allow-Origin' '*';
                    add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
                    add_header 'Access-Control-Allow-Headers' 'Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type';
                    add_header 'Access-Control-Max-Age' 1728000;
                    add_header 'Content-Type' 'text/plain; charset=utf-8';
                    add_header 'Content-Length' 0;
                    return 204;
                }
                proxy_pass http://backend:8000/api/v1/streams/playback/1/manifest;
                proxy_set_header Host $http_host;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type' always;
                add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
            }

            location ~* \.m3u8$ {
                if ($request_method = 'OPTIONS') {
                    add_header 'Access-Control-Allow-Origin' '*';
                    add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
                    add_header 'Access-Control-Allow-Headers' 'Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type';
                    add_header 'Access-Control-Max-Age' 1728000;
                    add_header 'Content-Type' 'text/plain; charset=utf-8';
                    add_header 'Content-Length' 0;
                    return 204;
                }
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type' always;
                add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
            }

            location ~* \.ts$ {
                if ($request_method = 'OPTIONS') {
                    add_header 'Access-Control-Allow-Origin' '*';
                    add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
                    add_header 'Access-Control-Allow-Headers' 'Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type';
                    add_header 'Access-Control-Max-Age' 1728000;
                    add_header 'Content-Type' 'text/plain; charset=utf-8';
                    add_header 'Content-Length' 0;
                    return 204;
                }
                add_header Cache-Control "public, max-age=3600" always;
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type' always;
                add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
            }
        }

        location /hls/offline/ {
            alias /usr/share/nginx/html/offline/;
            add_header Access-Control-Allow-Origin * always;

            location ~* \.m3u8$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Access-Control-Allow-Origin * always;
            }

            location ~* \.ts$ {
                add_header Cache-Control "public, max-age=3600";
                add_header Access-Control-Allow-Origin * always;
            }
        }

        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            add_header Access-Control-Allow-Origin * always;
        }
    }
}
