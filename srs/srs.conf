listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level       trace;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          21116;
    # IP del servidor (o $CANDIDATE si estás detrás de NAT en AWS/GCP)
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    # Eliminamos min_latency para dar prioridad a la fluidez del stream
    # min_latency     on;
    
    tcp_nodelay     on;
    
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }
    
    play {
        gop_cache       on;
        queue_length    30;  # Increase queue length for more internal buffering
        mw_latency      300;
    }
    
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    20;  # Massive fragments (20 seconds) to minimize the 'refresh' effect between chunks
        hls_window      120; # 120 seconds of history to ensure massive buffering
        hls_ts_file     [app]/[stream]-[seq]-[timestamp].ts;
        hls_wait_keyframe on;
        hls_acodec      aac;
        hls_vcodec      avc;
        hls_cleanup     on;
    }
    
    http_hooks {
        enabled         on;
        on_publish      http://backend:8000/api/v1/streams/webhook/on_publish;
        on_unpublish    http://backend:8000/api/v1/streams/webhook/on_unpublish;
    }
}
