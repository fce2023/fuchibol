listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      6;
    }
    
    http_hooks {
        enabled         on;
        on_publish      http://backend:8000/api/v1/streams/webhook/on_publish;
        on_unpublish    http://backend:8000/api/v1/streams/webhook/on_unpublish;
    }
}
